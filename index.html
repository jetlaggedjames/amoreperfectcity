<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>amoreperfectcity.com</title>

  <style>
    :root{
      --bg: #ffffff;
      --tile: #f2f2f2;
      --tileHover: #eaeaea;
      --stroke: rgba(0,0,0,.08);
      --radius: 14px;
      --max: 1100px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 22px 16px 60px;
    }

    /* Logo spot */
    .top{
      display:flex;
      justify-content:center;
      padding: 10px 0 22px;
    }
    .logo{
      width: 96px;
      height: 96px;
      border-radius: 22px;
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: var(--tile);
      display:grid;
      place-items:center;
    }
    .logo img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    /* Neal.fun-ish grid: wider tiles (not tall) */
    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
      .logo{ width: 84px; height: 84px; }
    }

    a.tile{
      display:block;
      aspect-ratio: 4 / 3; /* closer to neal.fun tile feel */
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: var(--tile);
      text-decoration:none;
      transition: transform .12s ease, background .12s ease;
      will-change: transform;
    }
    a.tile:hover{
      transform: scale(1.02); /* tiny grow */
      background: var(--tileHover);
    }
    a.tile:active{
      transform: scale(1.01);
    }
    a.tile:focus-visible{
      outline: 3px solid rgba(0,0,0,.18);
      outline-offset: 4px;
    }

    /* Cover image fills the tile */
    .tile img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <!-- Put logo.png in the same folder as this HTML -->
      <div class="logo">
        <img src="logo.png" alt="" onerror="this.remove();" />
      </div>
    </div>

    <div class="grid">
      <!-- TILE TEMPLATE:
           1) Change href to where your project lives
           2) Change src to your cover image
           If you don't have a cover yet, delete the <img> and it will stay blank.
      -->

      <a class="tile" href="projects/project-1/">
        <img src="covers/project-1.jpg" alt="" onerror="this.remove();" />
      </a>

      <a class="tile" href="projects/project-2/">
        <img src="covers/project-2.jpg" alt="" onerror="this.remove();" />
      </a>

      <a class="tile" href="projects/project-3/">
        <img src="covers/project-3.jpg" alt="" onerror="this.remove();" />
      </a>

      <a class="tile" href="projects/project-4/">
        <img src="covers/project-4.jpg" alt="" onerror="this.remove();" />
      </a>

      <a class="tile" href="projects/project-5/">
        <img src="covers/project-5.jpg" alt="" onerror="this.remove();" />
      </a>

      <a class="tile" href="projects/project-6/">
        <img src="covers/project-6.jpg" alt="" onerror="this.remove();" />
      </a>
    </div>
  </div>
</body>
</html>
